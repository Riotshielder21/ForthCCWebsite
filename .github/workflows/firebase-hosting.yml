name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/content/pages/**'
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Who is emailed when the API fails its /health check (comma separated). Applied on every deploy.
  API_ALERT_EMAILS: Riotshielder21@gmail.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Google Cloud
        id: google-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: fcc-website-api
          source: .
          project_id: fccwebsite-23cfc
          region: europe-west2
          flags: --allow-unauthenticated
          env_vars: |-
            GITHUB_REPOSITORY=Riotshielder21/ForthCCWebsite
            GITHUB_BRANCH=main
            GITHUB_CONTENT_BRANCH=live/web-admin-edit
            APP_CHECK_MODE=${{ vars.APP_CHECK_MODE || 'monitor' }}
            APP_CHECK_APP_IDS=${{ secrets.VITE_FIREBASE_APP_ID }}
            GITHUB_COMMIT_EMAIL=website@forthcanoeclub.co.uk
            GITHUB_PR_ASSIGNEE=Riotshielder21
            GITHUB_PR_NOTIFICATION_EMAIL=Riotshielder21@gmail.com
            GITHUB_PR_REVIEWERS=Riotshielder21
            GOOGLE_WORKSPACE_DELEGATED_USER=website@forthcanoeclub.co.uk
            GOOGLE_WORKSPACE_SENDER=no-reply@forthcanoeclub.co.uk
            GOOGLE_SHARED_DRIVE_ID=0APxBZiGs6yEGUk9PVA
            GOOGLE_FORMS_ROOT_FOLDER_ID=1_ptxNQkgpJdogsjDZ4Wbqb310LCEJI4Z
            PUBLIC_SITE_URL=https://new.forthcanoeclub.co.uk
            PUBLIC_SITE_URLS=https://new.forthcanoeclub.co.uk\,https://fccwebsite-23cfc.web.app\,https://fccwebsite-23cfc.firebaseapp.com
            WEBSITE_ISLIVE=${{ secrets.WEBSITE_ISLIVE || 'false' }}
          secrets: |-
            GITHUB_CONTENT_TOKEN=github-content-token:latest
            FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account-json:latest
            STRIPE_SECRET_KEY=stripe-test-secret-key:latest
            STRIPE_WEBHOOK_SECRET=stripe-test-webhook-secret:latest
            AUDIT_LOOKUP_SECRET=audit-lookup-secret:latest
            STRIPE_SUBSCRIPTION_ADMIN_KEY=stripe-subscription-admin-key:latest
            RENEWAL_JOB_TOKEN=renewal-job-token:latest

      - name: Verify API browser access
        env:
          API_URL: ${{ steps.deploy-api.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origins = [
            'https://new.forthcanoeclub.co.uk',
            'https://fccwebsite-23cfc.web.app',
            'https://fccwebsite-23cfc.firebaseapp.com'
          ];
          for (const origin of origins) {
            const response = await fetch(new URL('/api/admin/memberships', process.env.API_URL), {
              method: 'OPTIONS',
              headers: {
                Origin: origin,
                'Access-Control-Request-Method': 'PUT',
                'Access-Control-Request-Headers': 'authorization,content-type,x-firebase-appcheck'
              },
              signal: AbortSignal.timeout(30000)
            });
            assert.equal(response.status, 204, `Preflight failed for ${origin}`);
            assert.equal(response.headers.get('access-control-allow-origin'), origin, `Origin rejected: ${origin}`);
            const methods = (response.headers.get('access-control-allow-methods') || '').split(',').map(value => value.trim());
            for (const method of ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']) {
              assert.ok(methods.includes(method), `${method} is not allowed for ${origin}`);
            }
            const headers = (response.headers.get('access-control-allow-headers') || '').toLowerCase().split(',').map(value => value.trim());
            for (const header of ['authorization', 'content-type', 'x-firebase-appcheck']) {
              assert.ok(headers.includes(header), `${header} is not allowed for ${origin}`);
            }
            console.log(`API browser access verified: ${origin}`);
          }
          NODE

      - name: Build website
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_STORAGE_BUCKET',
            'VITE_FIREBASE_APP_ID',
            'VITE_APPCHECK_SITE_KEY'
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing Firebase web secrets: ${missing.join(', ')}`);
          NODE
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # Set the repository variable only after the custom domain's auth handler and OAuth redirect are configured.
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL: ${{ steps.deploy-api.outputs.url }}

      - name: Deploy Firebase services
        run: npx firebase-tools deploy --project fccwebsite-23cfc --only hosting,firestore:rules,storage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Deploy scheduled jobs (JustGo sync/upload, renewal emails)
        run: scripts/scheduled-jobs.sh deploy
        env:
          API_URL: ${{ steps.deploy-api.outputs.url }}
          GOOGLE_CLOUD_PROJECT: fccwebsite-23cfc
          # JustGo settings are repository variables; the schedules stay paused until the enable flags are true.
          JUSTGO_API_ENABLED: ${{ vars.JUSTGO_API_ENABLED }}
          JUSTGO_API_WRITES_ENABLED: ${{ vars.JUSTGO_API_WRITES_ENABLED }}
          JUSTGO_ORGANISATION_ID: ${{ vars.JUSTGO_ORGANISATION_ID }}
          JUSTGO_MEMBERSHIP_DEFINITIONS: ${{ vars.JUSTGO_MEMBERSHIP_DEFINITIONS }}
          JUSTGO_CREDENTIAL_DEFINITIONS: ${{ vars.JUSTGO_CREDENTIAL_DEFINITIONS }}
          JUSTGO_ACTIVE_MEMBERSHIP_STATUSES: ${{ vars.JUSTGO_ACTIVE_MEMBERSHIP_STATUSES }}
          JUSTGO_ACTIVE_MEMBER_STATUSES: ${{ vars.JUSTGO_ACTIVE_MEMBER_STATUSES }}
          JUSTGO_CLUB_MEMBER_ROLE: ${{ vars.JUSTGO_CLUB_MEMBER_ROLE }}
          JUSTGO_UNSUSPENDED_LEVELS: ${{ vars.JUSTGO_UNSUSPENDED_LEVELS }}

      - name: Configure API outage email alert
        run: node scripts/setup-api-monitoring.mjs
        env:
          API_URL: ${{ steps.deploy-api.outputs.url }}
          GOOGLE_CLOUD_PROJECT: fccwebsite-23cfc
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
