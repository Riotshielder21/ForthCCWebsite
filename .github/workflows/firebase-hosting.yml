name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/content/pages/**'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: fcc-website-api
          source: .
          project_id: fccwebsite-23cfc
          region: europe-west2
          flags: --allow-unauthenticated
          env_vars: |-
            GITHUB_REPOSITORY=Riotshielder21/ForthCCWebsite
            GITHUB_BRANCH=main
            GITHUB_CONTENT_BRANCH=live/web-admin-edit
            GITHUB_COMMIT_EMAIL=website@forthcanoeclub.co.uk
            GITHUB_PR_ASSIGNEE=Riotshielder21
            GITHUB_PR_NOTIFICATION_EMAIL=Riotshielder21@gmail.com
            GITHUB_PR_REVIEWERS=Riotshielder21
            GOOGLE_WORKSPACE_DELEGATED_USER=website@forthcanoeclub.co.uk
            GOOGLE_WORKSPACE_SENDER=no-reply@forthcanoeclub.co.uk
            GOOGLE_SHARED_DRIVE_ID=${{ secrets.GOOGLE_SHARED_DRIVE_ID }}
            GOOGLE_FORMS_ROOT_FOLDER_ID=${{ secrets.GOOGLE_FORMS_ROOT_FOLDER_ID }}
            PUBLIC_SITE_URL=https://forthcanoeclub.co.uk
          secrets: |-
            GITHUB_CONTENT_TOKEN=github-content-token:latest
            FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account-json:latest

      - name: Build website
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_API_BASE_URL: ${{ steps.deploy-api.outputs.url }}

      - name: Deploy Firebase services
        run: npx firebase-tools deploy --project fccwebsite-23cfc --only hosting,firestore:rules,storage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}